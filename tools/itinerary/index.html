<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Itinerary</title>
    <meta
      name="description"
      content="Plan a trip across time zones, then share it with a link."
    />
    <!-- Where the tool is mounted. The build stamps the real prefix in; the dev
         server rewrites it to "/". Everything else in the page is relative and
         resolves against this, which is what lets /itinerary/<id> work. -->
    <base href="@basePath@" />
    <script>
      // Set the theme before first paint so a stored light preference does not
      // flash the dark default.
      (function () {
        var t = null;
        try {
          t = localStorage.getItem("itin-theme");
        } catch (err) {}
        if (t !== "light" && t !== "dark") {
          t =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        }
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
