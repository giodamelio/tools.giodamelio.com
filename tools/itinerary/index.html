<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Itinerary</title>
    <meta
      name="description"
      content="A shareable travel itinerary that lives entirely in its own URL."
    />
    <base href="@basePath@" />
<style>
  :root {
    color-scheme: dark light;
    --bg:#111418; --fg:#e6e6e6; --muted:#9aa0a6; --accent:#6ea8ff;
    --border:#2a2f36; --card:#1a1e24; --rule:#22272e;
    --p0:oklch(0.80 0.11 210); --p1:oklch(0.80 0.11 155); --p2:oklch(0.80 0.11 75);
    --p3:oklch(0.80 0.11 320); --p4:oklch(0.80 0.11 265); --p5:oklch(0.80 0.11 25);
    --danger:oklch(0.72 0.16 25);
  }
  [data-theme="light"] {
    color-scheme: light;
    --bg:#ffffff; --fg:#1a1a1a; --muted:#666; --accent:#2563eb;
    --border:#e5e5e5; --card:#fafafa; --rule:#ececec;
    --p0:oklch(0.47 0.14 210); --p1:oklch(0.47 0.14 155); --p2:oklch(0.47 0.14 75);
    --p3:oklch(0.47 0.14 320); --p4:oklch(0.47 0.14 265); --p5:oklch(0.47 0.14 25);
    --danger:oklch(0.52 0.19 25);
  }
  html { scrollbar-gutter: stable; }
  html, body { margin:0; padding:0; background:var(--bg); color:var(--fg); }
  body {
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  a { color:var(--accent); }
  a:hover { color:var(--fg); }
  input, select, button, textarea { font:inherit; color:inherit; }
  @keyframes itin-spin { to { transform: rotate(360deg); } }
  .entry + .entry { border-top:1px solid var(--rule); }
  @media screen and (max-width: 860px) {
    .hdr-row { align-items:flex-start; }
    .hdr-title { flex:1 1 100% !important; width:100%; font-size:28px !important; }
    .hdr-actions { margin-left:0 !important; width:100%; }
    .tz-wrap, .type-wrap { margin-left:0 !important; }

    .sheet { padding:24px 16px 72px !important; }

    .entry {
      grid-template-columns:22px minmax(0,1fr) !important;
      column-gap:12px !important;
      row-gap:4px !important;
      padding:16px 0 !important;
    }
    .e-icon { grid-column:1; grid-row:1; }
    .e-time {
      grid-column:2; grid-row:1;
      text-align:left !important;
      display:flex; align-items:baseline; gap:7px;
    }
    .e-zone { line-height:1.35; }
    .e-body { grid-column:2; grid-row:2; }
    .e-people { grid-column:2; grid-row:3; padding-top:6px !important; }
    .row-actions { grid-column:2; grid-row:4; justify-content:flex-start !important; padding-top:6px !important; }
    .row-actions:empty { display:none; }
    .row-actions button { width:34px !important; height:34px !important; }
    .row-actions button svg { width:15px; height:15px; }
    .tz-wrap button, .type-wrap button { min-height:38px; }
    .filter-chips button { min-height:30px; padding:4px 13px !important; font-size:13px !important; }
    .who-chips button, .who-chips input { min-height:32px; }
    .modal-scrim .modal-card button { min-height:34px; }

    .cal-grid { min-width:620px; }
    .cal-scroll { margin:0 -16px; padding:0 16px; }

    .modal-scrim { padding:0 !important; align-items:stretch !important; }
    .modal-card { max-width:none !important; border:0 !important; border-radius:0 !important; min-height:100%; }

    .picker-pop { position:fixed !important; left:12px !important; right:12px !important; top:auto !important; bottom:12px !important; width:auto !important; z-index:70 !important; }
    .zone-pop { left:12px !important; right:12px !important; top:auto !important; bottom:12px !important; width:auto !important; max-height:66vh !important; }
  }
  @media screen and (max-width: 860px) {
    .app-header { margin-bottom:22px !important; }
    .hdr-row { gap:10px !important; min-height:0 !important; }
    .hdr-actions { gap:6px !important; }
    .app-header p { margin-top:6px !important; }
    .toolbar-row { gap:10px !important; margin-top:12px !important; }
    .day { margin-bottom:14px !important; }
    .gap-rule { margin:-4px 0 9px !important; }
    .day-head { padding-bottom:6px !important; }
    .entry { padding:12px 0 !important; }
    .e-people { padding-top:4px !important; }
    .row-actions { padding-top:4px !important; }
    .add-entry-wrap { margin-top:14px !important; }
  }
  @media screen and (max-width: 520px) {
    .hdr-actions button { flex:1 1 auto; justify-content:center; }
  }
  @media print {
    [data-theme] {
      --bg:#fff; --fg:#111; --muted:#555; --accent:#111; --border:#ccc; --card:#fff; --rule:#ddd;
      --p0:oklch(0.45 0.14 210); --p1:oklch(0.45 0.14 155); --p2:oklch(0.45 0.14 75);
      --p3:oklch(0.45 0.14 320); --p4:oklch(0.45 0.14 265); --p5:oklch(0.45 0.14 25);
      --danger:oklch(0.45 0.18 25);
    }
    html, body { background:#fff !important; color:#111 !important; }
    .no-print { display:none !important; }
    .day, .entry { break-inside:avoid; page-break-inside:avoid; }
    .entry { grid-template-columns:76px 22px minmax(0,1fr) 164px !important; }
    .sheet { padding:0 !important; max-width:none !important; }
    /* On screen the calendar grid lines are the parent background showing
       through 1px gaps, and printers drop backgrounds by default. */
    .cal-grid { gap:0 !important; border-color:var(--border) !important; }
    .cal-head, .cal-cell { border-right:1px solid var(--border); border-bottom:1px solid var(--border); }
  }
</style>
    <script>
      // Set the theme before first paint so a stored light preference does not
      // flash the dark default.
      (function () {
        var t = null;
        try {
          t = localStorage.getItem("itin-theme");
        } catch (err) {}
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
  </head>
  <body>
    <div id="itin-root"></div>

    <!-- The template dialect below started as the Claude Design source and is
         rendered by render.js. If a `select` ever needs an `sc-for` inside it,
         write it as `sc-select`: the HTML parser drops any non-option child of
         a real `select`, and render.js maps the alias back. -->
    <template id="itin-template">
<div data-theme="{{ theme }}" style="min-height:100vh;background:var(--bg);color:var(--fg)">
  <div class="sheet" style="max-width:800px;margin:0 auto;padding:48px 24px 96px">

    <sc-if value="{{ isLibrary }}">
      <header class="app-header" style="margin-bottom:32px">
        <a class="no-print" href="/" title="All tools" style="display:inline-flex;align-items:center;gap:6px;margin-bottom:12px;font-size:12px;color:var(--muted);text-decoration:none" style-hover="color:var(--accent)">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
          All tools
        </a>
        <div class="hdr-row" style="display:flex;align-items:center;gap:16px;min-height:40px;flex-wrap:wrap">
          <h1 class="hdr-title" style="margin:0;min-width:0;font-size:34px;font-weight:700;letter-spacing:-0.02em;line-height:1.15">Itineraries</h1>
          <div class="hdr-actions" style="margin-left:auto;flex:0 0 auto;display:flex;gap:8px;align-items:center">
            <button onClick="{{ toggleTheme }}" title="Toggle theme" aria-label="Toggle theme" style="background:var(--card);border:1px solid var(--border);border-radius:8px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1;cursor:pointer;padding:0" style-hover="border-color:var(--accent)">{{ themeIcon }}</button>
          </div>
        </div>
      </header>

      <sc-if value="{{ isLibraryEmpty }}">
        <div style="border:1px solid var(--border);border-radius:12px;background:var(--card);padding:28px 24px;text-align:center">
          <p style="margin:0 auto;max-width:44ch;font-size:14px;color:var(--muted);line-height:1.65">Plan a trip as a list of flights, drives, places to stay and things you have booked, each in its own time zone. Share it with a link, print it for the journey, or hand it to an AI assistant to fill in from your confirmation emails.</p>
          <div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:22px">
            <button onClick="{{ createItinerary }}" style="background:var(--accent);border:1px solid var(--accent);color:var(--bg);border-radius:9px;padding:11px 22px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap" style-hover="filter:brightness(1.08)">{{ createLabel }}</button>
            <a href="{{ demoUrl }}" style="display:inline-flex;align-items:center;background:transparent;border:1px solid var(--border);border-radius:9px;padding:11px 22px;font-size:14px;color:var(--fg);text-decoration:none;white-space:nowrap" style-hover="border-color:var(--accent);color:var(--accent)">View a demo trip</a>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{ hasLibrary }}">
        <ul style="list-style:none;margin:0;padding:0;display:grid;gap:8px">
          <sc-for list="{{ libraryRows }}" as="t">
            <li style="display:flex;align-items:center;gap:12px;border:1px solid var(--border);border-radius:10px;background:var(--card);padding:12px 12px 12px 16px">
              <a href="{{ t.href }}" style="min-width:0;flex:1 1 auto;text-decoration:none;color:inherit">
                <span style="display:block;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ t.title }}</span>
                <span style="display:block;font-size:12px;color:var(--muted);margin-top:2px">{{ t.note }}</span>
              </a>
              <a href="{{ t.href }}" style="flex:0 0 auto;background:transparent;border:1px solid var(--border);border-radius:8px;padding:6px 14px;font-size:13px;color:var(--fg);text-decoration:none" style-hover="border-color:var(--accent);color:var(--accent)">View</a>
              <span style="flex:0 0 auto;position:relative;display:flex">
                <button onClick="{{ t.onMenu }}" title="More" aria-label="More" style="background:transparent;border:1px solid transparent;border-radius:8px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;padding:0" style-hover="border-color:var(--border);color:var(--accent)">
                  <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><circle cx="12" cy="5" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="12" cy="19" r="1.6"></circle></svg>
                </button>
                <sc-if value="{{ t.menuOpen }}">
                  <span style="position:fixed;inset:0;z-index:40;display:block" onClick="{{ t.onCloseMenu }}"></span>
                  <span style="position:absolute;top:calc(100% + 6px);right:0;z-index:41;display:grid;gap:2px;min-width:210px;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:6px;box-shadow:0 16px 40px rgba(0,0,0,0.4)">
                    <sc-if value="{{ t.owned }}">
                      <a href="{{ t.editHref }}" style="display:block;border-radius:7px;padding:8px 10px;font-size:13px;color:var(--fg);text-decoration:none" style-hover="background:var(--card);color:var(--accent)">Edit</a>
                    </sc-if>
                    <button onClick="{{ t.onShare }}" style="background:transparent;border:0;border-radius:7px;padding:8px 10px;font-size:13px;color:var(--fg);text-align:left;cursor:pointer" style-hover="background:var(--card);color:var(--accent)">{{ t.shareLabel }}</button>
                    <span style="height:1px;background:var(--rule);margin:4px 2px;display:block"></span>
                    <span style="display:flex;align-items:stretch;gap:2px">
                      <button onClick="{{ t.onForget }}" style="flex:1 1 auto;background:transparent;border:0;border-radius:7px;padding:8px 10px;font-size:13px;color:var(--fg);text-align:left;cursor:pointer;white-space:nowrap" style-hover="background:var(--card);color:var(--accent)">Forget on this device</button>
                      <span style="position:relative;display:flex;flex:0 0 auto" onMouseEnter="{{ t.onForgetInfoEnter }}" onMouseLeave="{{ t.onInfoLeave }}">
                        <button onClick="{{ t.onForgetInfo }}" aria-label="What does forgetting do?" style="background:transparent;border:0;border-radius:7px;width:30px;color:var(--muted);cursor:help;padding:0;display:flex;align-items:center;justify-content:center" style-hover="color:var(--accent)">
                          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5.5" stroke-linecap="round"></path><circle cx="12" cy="7.6" r="0.9" fill="currentColor" stroke="none"></circle></svg>
                        </button>
                        <sc-if value="{{ t.forgetInfoOpen }}">
                          <span style="position:absolute;top:100%;right:0;z-index:42;padding-top:6px;display:block">
                            <span style="display:block;width:246px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:11px 13px;box-shadow:0 16px 40px rgba(0,0,0,0.4);font-size:12px;color:var(--muted);line-height:1.6;white-space:normal">Takes it off this list, on this device only. The itinerary itself stays put and any link you shared keeps working — but you give up the ability to change it, and that cannot be undone.</span>
                          </span>
                        </sc-if>
                      </span>
                    </span>
                    <sc-if value="{{ t.owned }}">
                      <span style="display:flex;align-items:stretch;gap:2px">
                        <button onClick="{{ t.onDelete }}" style="flex:1 1 auto;background:transparent;border:0;border-radius:7px;padding:8px 10px;font-size:13px;color:var(--danger);text-align:left;cursor:pointer;white-space:nowrap" style-hover="background:color-mix(in oklab, var(--danger) 12%, transparent)">Delete for everyone</button>
                        <span style="position:relative;display:flex;flex:0 0 auto" onMouseEnter="{{ t.onDeleteInfoEnter }}" onMouseLeave="{{ t.onInfoLeave }}">
                          <button onClick="{{ t.onDeleteInfo }}" aria-label="What does deleting do?" style="background:transparent;border:0;border-radius:7px;width:30px;color:var(--muted);cursor:help;padding:0;display:flex;align-items:center;justify-content:center" style-hover="color:var(--danger)">
                            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5.5" stroke-linecap="round"></path><circle cx="12" cy="7.6" r="0.9" fill="currentColor" stroke="none"></circle></svg>
                          </button>
                          <sc-if value="{{ t.deleteInfoOpen }}">
                            <span style="position:absolute;top:100%;right:0;z-index:42;padding-top:6px;display:block">
                              <span style="display:block;width:246px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:11px 13px;box-shadow:0 16px 40px rgba(0,0,0,0.4);font-size:12px;color:var(--muted);line-height:1.6;white-space:normal">Erases the itinerary itself. Everyone you gave the link to loses it too, not just you. There is no undo.</span>
                            </span>
                          </sc-if>
                        </span>
                      </span>
                    </sc-if>
                  </span>
                </sc-if>
              </span>
            </li>
          </sc-for>
        </ul>
        <div style="margin-top:18px">
          <button onClick="{{ createItinerary }}" style="background:var(--accent);border:1px solid var(--accent);color:var(--bg);border-radius:9px;padding:9px 18px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap" style-hover="filter:brightness(1.08)">{{ createLabel }}</button>
          <a href="{{ demoUrl }}" style="margin-left:8px;font-size:13px">View a demo trip</a>
        </div>
      </sc-if>

      <sc-if value="{{ showCreateError }}">
        <div style="margin-top:14px;font-size:13px;color:var(--danger);border:1px solid var(--danger);border-radius:8px;padding:9px 12px">{{ createError }}</div>
      </sc-if>
    </sc-if>

    <sc-if value="{{ isTrip }}">
    <header class="app-header" style="margin-bottom:44px">
      <a class="no-print" href="./" title="All itineraries" style="display:inline-flex;align-items:center;gap:6px;margin-bottom:12px;font-size:12px;color:var(--muted);text-decoration:none" style-hover="color:var(--accent)">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
        All itineraries
      </a>
      <div class="hdr-row" style="display:flex;align-items:center;gap:16px;min-height:40px;flex-wrap:wrap">
      <sc-if value="{{ editing }}">
        <input value="{{ title }}" onChange="{{ onTitle }}" placeholder="Name this trip" title="Trip name" class="hdr-title" style="flex:1 1 auto;min-width:0;box-sizing:content-box;background:transparent;border:0;border-bottom:1px dashed var(--accent);font-size:34px;font-weight:700;letter-spacing:-0.02em;line-height:39.1px;height:39.1px;padding:0;margin:0;outline:none" />
      </sc-if>
      <sc-if value="{{ notEditing }}">
        <h1 class="hdr-title" style="margin:0;min-width:0;font-size:34px;font-weight:700;letter-spacing:-0.02em;line-height:1.15;border-bottom:1px solid transparent">{{ title }}</h1>
      </sc-if>
        <div class="no-print hdr-actions" style="margin-left:auto;flex:0 0 auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center">
<button onClick="{{ copyLink }}" style="background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer" style-hover="border-color:var(--accent)">{{ copyLabel }}</button>
      <button onClick="{{ doPrint }}" style="background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer" style-hover="border-color:var(--accent)">Print</button>
      <sc-if value="{{ canEdit }}">
        <!-- Fixed width: "Done" is bold and wider than "Edit", and this row is
             right-aligned, so a size change would slide Share and Print. -->
        <button onClick="{{ toggleEdit }}" style="background:{{ editBg }};border:1px solid {{ editBorder }};color:{{ editFg }};border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;font-weight:{{ editWeight }};min-width:70px;text-align:center">{{ editLabel }}</button>
      </sc-if>
      <button onClick="{{ toggleTheme }}" title="Toggle theme" aria-label="Toggle theme" style="background:var(--card);border:1px solid var(--border);border-radius:8px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1;cursor:pointer;padding:0" style-hover="border-color:var(--accent)">{{ themeIcon }}</button>
      <button onClick="{{ openSettings }}" title="Settings" aria-label="Settings" style="background:var(--card);border:1px solid var(--border);border-radius:8px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;padding:0" style-hover="border-color:var(--accent);color:var(--accent)">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.1"></circle><path d="M19.4 14.5a1.6 1.6 0 0 0 .3 1.8l.1.1a1.9 1.9 0 1 1-2.7 2.7l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5v.2a1.9 1.9 0 1 1-3.8 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a1.9 1.9 0 1 1-2.7-2.7l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3.4a1.9 1.9 0 1 1 0-3.8h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a1.9 1.9 0 1 1 2.7-2.7l.1.1a1.6 1.6 0 0 0 1.8.3h.1a1.6 1.6 0 0 0 1-1.5V3.4a1.9 1.9 0 1 1 3.8 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a1.9 1.9 0 1 1 2.7 2.7l-.1.1a1.6 1.6 0 0 0-.3 1.8v.1a1.6 1.6 0 0 0 1.5 1h.2a1.9 1.9 0 1 1 0 3.8h-.1a1.6 1.6 0 0 0-1.5 1z"></path></svg>
      </button>
        </div>
      </div>
      <div class="no-print edit-actions" style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px">
        <sc-if value="{{ editing }}">
          <sc-if value="{{ hasKey }}">
              <button onClick="{{ openSmart }}" title="Paste a confirmation email or notes and an AI agent proposes changes here, for you to review before anything is applied" style="background:color-mix(in oklab, var(--accent) 12%, transparent);border:1px solid var(--accent);border-radius:7px;height:26px;padding:0 11px;font-size:12px;font-weight:600;color:var(--accent);cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap" style-hover="background:color-mix(in oklab, var(--accent) 22%, transparent)">
                <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20 15 9"></path><path d="M14 5.5 15.4 8l2.6 1.4-2.6 1.4L14 13.4l-1.4-2.6L10 9.4 12.6 8z"></path><path d="M6 4.2l.6 1.2 1.2.6-1.2.6L6 7.8l-.6-1.2L4.2 6l1.2-.6z"></path></svg>
                Smart Add
              </button>
          </sc-if>
          <sc-if value="{{ noKey }}">
              <span style="position:relative;display:flex" onMouseEnter="{{ onSmartHintEnter }}" onMouseLeave="{{ onSmartHintLeave }}">
                <button onClick="{{ toggleSmartHint }}" aria-disabled="true" style="background:transparent;border:1px dashed var(--border);border-radius:7px;height:26px;padding:0 11px;font-size:12px;font-weight:600;color:var(--muted);cursor:help;display:flex;align-items:center;gap:6px;white-space:nowrap" style-hover="border-color:var(--accent);color:var(--accent)">
                  <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20 15 9"></path><path d="M14 5.5 15.4 8l2.6 1.4-2.6 1.4L14 13.4l-1.4-2.6L10 9.4 12.6 8z"></path><path d="M6 4.2l.6 1.2 1.2.6-1.2.6L6 7.8l-.6-1.2L4.2 6l1.2-.6z"></path></svg>

                  <span style="position:absolute;top:100%;right:0;z-index:30;padding-top:8px;display:block">
                    <span style="display:block;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;width:260px;box-shadow:0 16px 40px rgba(0,0,0,0.4);text-align:left">

              </span>
          </sc-if>
            <button onClick="{{ openLlm }}" title="Lets an AI assistant in another app read and change this itinerary for the next hour" style="background:color-mix(in oklab, var(--accent) 12%, transparent);border:1px solid var(--accent);border-radius:7px;height:26px;padding:0 11px;font-size:12px;font-weight:600;color:var(--accent);cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap" style-hover="background:color-mix(in oklab, var(--accent) 22%, transparent)">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor"><path d="M12 2.5l1.9 5.4 5.4 1.9-5.4 1.9L12 17.1l-1.9-5.4-5.4-1.9 5.4-1.9z"></path><path d="M18.5 15l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"></path></svg>
              Hand off to an assistant
            </button>
            <button onClick="{{ openAddTop }}" title="Add an item" style="background:var(--accent);border:1px solid var(--accent);border-radius:7px;height:26px;padding:0 11px;font-size:12px;font-weight:600;line-height:1;color:var(--bg);cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap" style-hover="filter:brightness(1.08)"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Add</button>
        </sc-if>
      </div>
      <p style="margin:8px 0 0;color:var(--muted);font-size:14px">{{ subtitle }}<sc-if value="{{ showSaveNote }}"><span class="no-print" style="color:var(--muted)"> · {{ saveNote }}</span></sc-if></p>
      <sc-if value="{{ showSaveError }}">
        <div class="no-print" style="display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:10px;font-size:13px;color:var(--danger);border:1px solid var(--danger);border-radius:8px;padding:9px 12px">

        </div>
      </sc-if>
      <sc-if value="{{ showLoadError }}">
        <div style="margin-top:10px;font-size:13px;color:var(--danger);border:1px solid var(--danger);border-radius:8px;padding:9px 12px">{{ loadError }}</div>
      </sc-if>
      <sc-if value="{{ showToolbar }}">
      <div class="no-print toolbar-row" style="display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:16px">
        <span style="display:flex">
          <button onClick="{{ showList }}" title="View as list" aria-label="View as list" style="background:{{ listBg }};border:1px solid {{ listBorder }};border-radius:9px 0 0 9px;width:52px;height:44px;padding:0;color:{{ listFg }};cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative;margin-right:-1px;z-index:{{ listZ }}" style-hover="border-color:var(--accent)">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
          </button>
          <button onClick="{{ showCalendar }}" title="View as calendar" aria-label="View as calendar" style="background:{{ calBg }};border:1px solid {{ calBorder }};border-radius:0 9px 9px 0;width:52px;height:44px;padding:0;color:{{ calFg }};cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative;z-index:{{ calZ }}" style-hover="border-color:var(--accent)">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"></rect><path d="M3.5 9.5h17M8 3.5v3M16 3.5v3"></path></svg>
          </button>
        </span>
        <sc-if value="{{ hasPeople }}">
          <span class="filter-chips" style="display:flex;flex-wrap:wrap;gap:6px;align-items:center">

              <button onClick="{{ p.onToggle }}" style="font-size:12px;color:{{ p.fg }};background:{{ p.bg }};border:1px solid {{ p.border }};border-radius:99px;padding:2px 11px;cursor:pointer">{{ p.name }}</button>

          </span>
        </sc-if>
        <span class="type-wrap" style="margin-left:auto;display:flex;position:relative;align-items:center">

            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="color:var(--muted);flex:0 0 auto"><path d="M3.5 5.5h17l-6.6 7.6v5.6l-3.8 2.3v-7.9z"></path></svg>
            <span style="flex:1 1 auto;min-width:0;text-align:left;overflow:hidden;text-overflow:ellipsis">{{ typeFilterLabel }}</span>
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--muted);flex:0 0 auto"><path d="M6 9.5l6 6 6-6"></path></svg>
          </button>
          <sc-if value="{{ typeMenuOpen }}">
            <span style="position:fixed;inset:0;z-index:40;display:block" onClick="{{ closeTypeMenu }}"></span>
            <span style="position:absolute;top:calc(100% + 6px);left:0;z-index:41;display:grid;gap:2px;min-width:216px;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:6px;box-shadow:0 16px 40px rgba(0,0,0,0.4)">

                <button onClick="{{ t.onToggle }}" style="display:flex;align-items:center;gap:8px;background:transparent;border:0;border-radius:7px;padding:7px 9px;font-size:13px;color:{{ t.fg }};text-align:left;cursor:pointer" style-hover="background:var(--card)">
                  <sc-if value="{{ t.on }}">
                    <svg viewBox="0 0 24 24" width="15" height="15" style="flex:0 0 auto" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="var(--accent)"></rect><path d="M7.6 12.4l3 3 5.8-6.4" fill="none" stroke="var(--bg)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                  </sc-if>
                  <sc-if value="{{ t.off }}">
                    <svg viewBox="0 0 24 24" width="15" height="15" style="flex:0 0 auto" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="var(--border)" stroke-width="2"></rect></svg>
                  </sc-if>
                <sc-if value="{{ t.isFlight }}">
                  <span style="flex:0 0 auto;display:flex;width:16px;color:var(--muted)"><svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" stroke="none"><path d="M21 15.5v-1.9l-7.6-4.6V3.8a1.4 1.4 0 0 0-2.8 0V9L3 13.6v1.9l7.6-2.3v4.9l-2.1 1.5v1.4l3.5-1 3.5 1v-1.4l-2.1-1.5v-4.9z"></path></svg></span>
                </sc-if>
                <sc-if value="{{ t.isTransit }}">
                  <span style="flex:0 0 auto;display:flex;width:16px;color:var(--muted)"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3.5" width="14" height="13" rx="3"></rect><path d="M5 10h14"></path><path d="M8.5 20.5 6.5 17M15.5 20.5 17.5 17"></path><circle cx="9" cy="13.3" r="0.9"></circle><circle cx="15" cy="13.3" r="0.9"></circle></svg></span>
                </sc-if>
                <sc-if value="{{ t.isDrive }}">
                  <span style="flex:0 0 auto;display:flex;width:16px;color:var(--muted)"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15v-2.2L5 8h14l2 4.8V15"></path><path d="M3 15h18v3h-3v-1.5H6V18H3z"></path><circle cx="7.5" cy="15" r="1.4"></circle><circle cx="16.5" cy="15" r="1.4"></circle></svg></span>
                </sc-if>
                <sc-if value="{{ t.isLodging }}">
                  <span style="flex:0 0 auto;display:flex;width:16px;color:var(--muted)"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19V6"></path><path d="M3 11h13a5 5 0 0 1 5 5v3"></path><path d="M3 15h18"></path><circle cx="7.5" cy="8" r="1.6"></circle></svg></span>
                </sc-if>
                <sc-if value="{{ t.isBooking }}">
                  <span style="flex:0 0 auto;display:flex;width:16px;color:var(--muted)"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v7a2 2 0 0 0 4 0V3"></path><path d="M9 10v11"></path><path d="M17 3c-1.5 1.5-2 3.5-2 5.5V12h4V8.5c0-2-.5-4-2-5.5z"></path><path d="M17 12v9"></path></svg></span>
                </sc-if>
                <sc-if value="{{ t.isNote }}">
                  <span style="flex:0 0 auto;display:flex;width:16px;color:var(--muted)"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="3.5" width="15" height="17" rx="2.5"></rect><path d="M8.5 9h7M8.5 13h7M8.5 17h4"></path></svg></span>
                </sc-if>
                  <span style="flex:1 1 auto;min-width:0">{{ t.label }}</span>
                  <span style="flex:0 0 auto;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums">{{ t.count }}</span>
                </button>
              </sc-for>
              <span style="height:1px;background:var(--rule);margin:4px 2px;display:block"></span>
              <span style="display:flex;gap:6px;padding:0 3px 2px">
                <button onClick="{{ showAllTypes }}" style="flex:1 1 auto;background:transparent;border:1px solid var(--border);border-radius:7px;padding:5px 0;font-size:12px;color:var(--fg);cursor:pointer" style-hover="border-color:var(--accent);color:var(--accent)">All</button>
                <button onClick="{{ showNoTypes }}" style="flex:1 1 auto;background:transparent;border:1px solid var(--border);border-radius:7px;padding:5px 0;font-size:12px;color:var(--fg);cursor:pointer" style-hover="border-color:var(--accent);color:var(--accent)">None</button>
              </span>
            </span>
          </sc-if>
        </span>
        <span class="tz-wrap" style="display:flex;position:relative;align-items:center">
          <button onClick="{{ openTzMode }}" title="Which time zone to show times in" style="display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:0 10px 0 11px;height:34px;width:206px;font-size:13px;color:var(--fg);cursor:pointer;white-space:nowrap" style-hover="border-color:var(--accent)">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="color:var(--muted);flex:0 0 auto"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 1.8"></path></svg>
            <span style="min-width:0;overflow:hidden;text-overflow:ellipsis">{{ tzModeLabel }}</span>
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--muted);flex:0 0 auto"><path d="M6 9.5l6 6 6-6"></path></svg>
          </button>
        </span>
      </div>
      </sc-if>
    </header>


    <sc-if value="{{ isList }}">
    <sc-for list="{{ days }}" as="day">
      <section class="day" style="margin-bottom:38px">
        <sc-if value="{{ day.hasGap }}">
          <div class="gap-rule" style="display:flex;align-items:center;gap:10px;margin:-26px 0 11px">
            <div style="flex:1;height:1px;background:var(--rule)"></div>
            <span style="font-size:10.5px;color:var(--muted);white-space:nowrap;letter-spacing:0.05em">{{ day.gapLabel }}</span>
            <div style="flex:1;height:1px;background:var(--rule)"></div>
          </div>
        </sc-if>
        <div class="day-head" style="display:flex;align-items:baseline;gap:10px;padding-bottom:2px">
          <h2 style="margin:0;font-size:15px;font-weight:650;letter-spacing:-0.01em;color:{{ day.headColor }}">{{ day.weekday }}</h2>
          <span style="font-size:15px;color:var(--muted)">{{ day.date }}</span>
          <sc-if value="{{ day.isToday }}">
            <span style="align-self:center;font-size:9.5px;text-transform:uppercase;letter-spacing:0.1em;font-weight:650;color:var(--accent);border:1px solid color-mix(in oklab, var(--accent) 40%, transparent);background:color-mix(in oklab, var(--accent) 10%, transparent);border-radius:99px;padding:1px 7px">Today</span>
          </sc-if>
          <div class="no-print" style="margin-left:auto;align-self:center;width:26px;height:26px;display:flex">
          <sc-if value="{{ editing }}">
            <button onClick="{{ day.onAdd }}" title="Add an item on this day" aria-label="Add an item on this day" style="background:var(--accent);border:1px solid var(--accent);border-radius:7px;width:26px;height:26px;font-size:16px;font-weight:600;line-height:1;color:var(--bg);cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center" style-hover="filter:brightness(1.08)">+</button>
          </sc-if>
          </div>
        </div>

        <sc-for list="{{ day.entries }}" as="e">
          <div class="entry" style="display:grid;grid-template-columns:76px 22px minmax(0,1fr) 164px 76px;gap:16px;padding:14px 0;align-items:start">
            <div class="e-time" style="text-align:right">
              <div style="font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.35">{{ e.time }}</div>
              <div class="e-zone" style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em">{{ e.zone }}</div>
            </div>
            <div class="e-icon" title="{{ e.kind }}" aria-label="{{ e.kind }}" style="width:22px;height:22px;color:var(--muted);display:flex;align-items:center;justify-content:center;margin-top:2px;cursor:default" style-hover="color:var(--accent)">
              <sc-if value="{{ e.isFlight }}">
                <svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor" stroke="none"><path d="M21 15.5v-1.9l-7.6-4.6V3.8a1.4 1.4 0 0 0-2.8 0V9L3 13.6v1.9l7.6-2.3v4.9l-2.1 1.5v1.4l3.5-1 3.5 1v-1.4l-2.1-1.5v-4.9z"></path></svg>
              </sc-if>
              <sc-if value="{{ e.isDrive }}">
                <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15v-2.2L5 8h14l2 4.8V15"></path><path d="M3 15h18v3h-3v-1.5H6V18H3z"></path><circle cx="7.5" cy="15" r="1.4"></circle><circle cx="16.5" cy="15" r="1.4"></circle></svg>
              </sc-if>
              <sc-if value="{{ e.isTransit }}">
                <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3.5" width="14" height="13" rx="3"></rect><path d="M5 10h14"></path><path d="M8.5 20.5 6.5 17M15.5 20.5 17.5 17"></path><circle cx="9" cy="13.3" r="0.9"></circle><circle cx="15" cy="13.3" r="0.9"></circle></svg>
              </sc-if>
              <sc-if value="{{ e.isLodging }}">
                <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19V6"></path><path d="M3 11h13a5 5 0 0 1 5 5v3"></path><path d="M3 15h18"></path><circle cx="7.5" cy="8" r="1.6"></circle></svg>
              </sc-if>
              <sc-if value="{{ e.isBooking }}">
                <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v7a2 2 0 0 0 4 0V3"></path><path d="M9 10v11"></path><path d="M17 3c-1.5 1.5-2 3.5-2 5.5V12h4V8.5c0-2-.5-4-2-5.5z"></path><path d="M17 12v9"></path></svg>
              </sc-if>
              <sc-if value="{{ e.isNote }}">
                <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="3.5" width="15" height="17" rx="2.5"></rect><path d="M8.5 9h7M8.5 13h7M8.5 17h4"></path></svg>
              </sc-if>
            </div>
            <div class="e-body" style="min-width:0">
              <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap">
                <span style="font-size:15px;font-weight:550">{{ e.title }}</span>
                <sc-if value="{{ e.hasDetail }}">
                  <span onMouseEnter="{{ e.onDetailEnter }}" onMouseLeave="{{ e.onDetailLeave }}" style="position:relative;display:inline-flex">
                    <button onClick="{{ e.onDetail }}" style="background:transparent;border:0;border-bottom:1px dashed var(--muted);padding:0 0 1px;font-size:12px;color:var(--muted);cursor:pointer" style-hover="color:var(--accent);border-color:var(--accent)">{{ e.carrier }}</button>
                    <sc-if value="{{ e.detailOpen }}">
                      <span class="no-print" style="position:absolute;top:100%;left:0;z-index:30;padding-top:8px;display:block">
                      <span style="display:block;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;min-width:250px;box-shadow:0 16px 40px rgba(0,0,0,0.4)">
                        <span style="display:block;font-size:13px;font-weight:600;margin-bottom:6px">{{ e.detailTitle }}</span>
                        <span style="display:grid;grid-template-columns:auto 1fr auto;column-gap:14px;font-size:12px;line-height:1.7">
                          <sc-for list="{{ e.detailRows }}" as="d">
                            <span style="display:contents">
                              <span style="color:var(--muted)">{{ d.label }}</span>
                              <span style="min-width:0">{{ d.place }}</span>
                              <span style="text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums">{{ d.time }}</span>
                            </span>
                          </sc-for>
                        </span>
                        <sc-if value="{{ e.trackUrl }}">
                          <a href="{{ e.trackUrl }}" target="_blank" rel="noreferrer" style="display:inline-block;margin-top:9px;font-size:12px">{{ e.trackLabel }}</a>

                      </span>
                      </span>
                    </sc-if>
                  </span>
                </sc-if>
                <sc-if value="{{ e.plainCarrier }}">
                  <span style="font-size:12px;color:var(--muted)">{{ e.carrier }}</span>

              </div>
              <sc-for list="{{ e.meta }}" as="m">

            </div>
            <div class="e-people" style="display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;padding-top:2px">
              <sc-for list="{{ e.people }}" as="p">
                <span style="font-size:11px;color:{{ p.fg }};background:{{ p.bg }};border:1px solid {{ p.border }};border-radius:99px;padding:1px 8px;white-space:nowrap">{{ p.name }}</span>
              </sc-for>
            </div>
            <div class="no-print row-actions" style="display:flex;gap:4px;justify-content:flex-end;padding-top:1px">

                  <button onClick="{{ r.onToggle }}" style="font-size:12px;color:{{ r.fg }};background:{{ r.bg }};border:1px solid {{ r.border }};border-radius:99px;padding:3px 12px;cursor:pointer;display:flex;align-items:center;gap:5px">
                    <sc-if value="{{ r.on }}">
                      <svg viewBox="0 0 24 24" width="12" height="12" style="flex:0 0 auto" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="6" fill="currentColor"></rect><path d="M7.6 12.4l3 3 5.8-6.4" fill="none" stroke="var(--bg)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                    </sc-if>
                    <sc-if value="{{ r.off }}">
                      <svg viewBox="0 0 24 24" width="12" height="12" style="flex:0 0 auto" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="6" fill="none" stroke="currentColor" stroke-width="2.2"></rect></svg>
                    </sc-if>
                    {{ r.name }}
                  </button>
                </sc-for>
                <input value="{{ newPerson }}" onChange="{{ onNewPersonChange }}" onKeyDown="{{ onDraftNewPerson }}" placeholder="+ add person" style="font-size:12px;background:transparent;border:1px dashed var(--border);border-radius:99px;padding:3px 12px;width:120px;outline:none" />
              </div>
            </div>
          </div>

          <div style="display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--rule)">
            <button onClick="{{ closeDraft }}" style="background:transparent;border:1px solid var(--border);border-radius:8px;padding:7px 14px;font-size:13px;color:var(--muted);cursor:pointer" style-hover="border-color:var(--accent);color:var(--accent)">Cancel</button>
            <button onClick="{{ commitDraft }}" style="background:var(--accent);border:1px solid var(--accent);color:var(--bg);border-radius:8px;padding:7px 16px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap">Add item</button>
          </div>
        </div>
      </div>
    </sc-if>

  </div>
</div>
    </template>

    <!-- Relative, and correct even though this page is also served at
         <base>/<id> and <base>/<id>/edit, because the <base> tag above pins
         where they resolve from. -->
    <script src="./zone-data.js"></script>
    <script src="./render.js"></script>
    <script src="./itinerary.js"></script>
  </body>
</html>
